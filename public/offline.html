<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hors-Ligne - Emberton Group</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    body {
      background: linear-gradient(135deg, #041F40 0%, #0B223D 100%);
      color: #FFFFFF;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      text-align: center;
    }
    .card {
      background: rgba(25, 51, 86, 0.6);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(214, 199, 153, 0.3);
      border-radius: 1.25rem;
      padding: 2.5rem 2rem;
      max-width: 440px;
      width: 100%;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.35);
    }
    .icon {
      width: 64px;
      height: 64px;
      margin: 0 auto 1.5rem;
      background: rgba(214, 199, 153, 0.15);
      border: 1px solid rgba(214, 199, 153, 0.4);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #D6C799;
    }
    h1 {
      font-size: 1.5rem;
      font-weight: 800;
      color: #FFFFFF;
      margin-bottom: 0.75rem;
    }
    .gold {
      color: #D6C799;
    }
    p {
      color: #CBD5E1;
      font-size: 0.925rem;
      line-height: 1.6;
      margin-bottom: 1.75rem;
    }
    .notice {
      background: rgba(4, 31, 64, 0.6);
      border: 1px solid rgba(214, 199, 153, 0.2);
      border-radius: 0.75rem;
      padding: 0.875rem 1rem;
      font-size: 0.8rem;
      color: #D6C799;
      margin-bottom: 1.75rem;
      text-align: left;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: #D6C799;
      color: #041F40;
      font-weight: 700;
      font-size: 0.95rem;
      padding: 0.875rem 1.75rem;
      border-radius: 0.75rem;
      text-decoration: none;
      border: none;
      cursor: pointer;
      width: 100%;
      transition: all 0.2s ease;
    }
    .btn:hover {
      background: #e2d5ad;
      transform: translateY(-1px);
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">
      <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="1" y1="1" x2="23" y2="23"></line>
        <path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.55"></path>
        <path d="M5 12.55a10.94 10.94 0 0 1 5.17-2.39"></path>
        <path d="M10.71 5.05A16 16 0 0 1 22.58 9"></path>
        <path d="M1.42 9a15.91 15.91 0 0 1 4.7-2.88"></path>
        <path d="M8.53 16.11a6 6 0 0 1 6.95 0"></path>
        <line x1="12" y1="20" x2="12.01" y2="20"></line>
      </svg>
    </div>

    <h1>Connexion <span class="gold">Hors-Ligne</span></h1>
    <p>
      Vous semblez être dans une zone sans réseau ou avec une connexion instable.
    </p>

    <div class="notice">
      🔒 <strong>Vos données sont protégées :</strong> Si vous étiez en train de remplir un questionnaire d'audit, votre progression est conservée en mémoire locale.
    </div>

    <button class="btn" onclick="window.location.reload()">
      Réessayer la connexion
    </button>
  </div>
</body>
</html>
